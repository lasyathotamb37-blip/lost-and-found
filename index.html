<!DOCTYPE html>
<html>
  <head>
    
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindIt - Lost & Found Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #202b45;
}

header {
    background: #182747;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #62d6c5;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
    font-size: 14px;
}

nav a:hover {
    color: #62d6c5;
}

.hero {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(120deg, #182747, #315b83);
    color: white;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 16px;
    color: #dce7f2;
}

.search {
    margin: 25px auto 0;
    max-width: 500px;
    display: flex;
    gap: 8px;
}

.search input {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 7px;
    outline: none;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    background: #16a995;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #108775;
}

.container {
    width: 88%;
    max-width: 1150px;
    margin: 40px auto;
}

.section-title {
    margin-bottom: 22px;
    font-size: 25px;
}

.actions {
    display: flex;
    gap: 15px;
    margin-bottom: 35px;
    flex-wrap: wrap;
}

.actions button {
    padding: 14px 23px;
}

.lost-btn {
    background: #e76b55;
}

.found-btn {
    background: #315b83;
}

.items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 15px #00000010;
}

.card .emoji {
    font-size: 48px;
    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    margin: 7px 0;
    color: #667085;
    font-size: 14px;
}

.tag {
    display: inline-block;
    padding: 5px 10px;
    background: #e0f5ef;
    color: #108775;
    border-radius: 15px;
    font-size: 12px;
    margin-bottom: 12px;
}

.form-section {
    display: none;
    background: white;
    padding: 28px;
    margin-top: 40px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #00000010;
    max-width: 600px;
}

.form-section input,
.form-section select,
.form-section textarea {
    width: 100%;
    padding: 12px;
    margin: 9px 0 17px;
    border: 1px solid #d5dbe5;
    border-radius: 6px;
}

.form-section label {
    font-weight: bold;
    font-size: 14px;
}

.form-section h2 {
    margin-bottom: 20px;
}

footer {
    background: #182747;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 60px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 7px;
    }

    .hero h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Find<span>It</span></div>
    <nav>
        <a href="#home">Home</a>
        <a href="#items">Items</a>
        <a href="#report">Report Item</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Lost Something? Find It Here!</h1>
    <p>A simple platform to connect lost items with their owners.</p>

    <div class="search">
        <input type="text" id="searchInput"
        placeholder="Search for an item...">
        <button onclick="searchItems()">Search</button>
    </div>
</section>

<main class="container">

    <h2 class="section-title">What would you like to do?</h2>

    <div class="actions">
        <button class="lost-btn"
        onclick="openForm('Lost')">+ Report Lost Item</button>

        <button class="found-btn"
        onclick="openForm('Found')">+ Report Found Item</button>
    </div>

    <section id="report" class="form-section">
        <h2 id="formTitle">Report an Item</h2>

        <form id="itemForm">
            <label>Item Name</label>
            <input type="text" id="itemName" required
            placeholder="Example: Black Wallet">

            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option>Electronics</option>
                <option>Documents</option>
                <option>Bags</option>
                <option>Accessories</option>
                <option>Books</option>
                <option>Others</option>
            </select>

            <label>Location</label>
            <input type="text" id="location" required
            placeholder="Where was it lost/found?">

            <label>Date</label>
            <input type="date" id="date" required>

            <label>Description</label>
            <textarea id="description" rows="3"
            placeholder="Describe the item"></textarea>

            <label>Contact Email</label>
            <input type="email" id="email" required
            placeholder="Enter your email">

            <button type="submit">Submit Report</button>
            <button type="button" onclick="closeForm()"
            style="background:#777">Cancel</button>
        </form>
    </section>

    <section id="items">
        <h2 class="section-title" style="margin-top:45px">
            Recently Reported Items
        </h2>

        <div class="items" id="itemList"></div>
    </section>

</main>

<footer>
    <h3>FindIt - Lost & Found Portal</h3>
    <p>Helping people find what they have lost.</p>
    <p>© 2026 FindIt. College Project.</p>
</footer>

<script>

let currentType = "Lost";

let items = [
    {
        name: "Black Wallet",
        category: "Accessories",
        location: "College Library",
        date: "2026-11-10",
        description: "A black leather wallet.",
        email: "demo@example.com",
        type: "Lost",
        emoji: "👛"
    },
    {
        name: "Water Bottle",
        category: "Others",
        location: "College Canteen",
        date: "2026-11-11",
        description: "Blue water bottle.",
        email: "demo@example.com",
        type: "Found",
        emoji: "🧴"
    },
    {
        name: "Notebook",
        category: "Books",
        location: "Classroom",
        date: "2026-11-09",
        description: "A college notebook.",
        email: "demo@example.com",
        type: "Lost",
        emoji: "📒"
    }
];

function openForm(type) {
    currentType = type;
    document.getElementById("formTitle").innerText =
        "Report " + type + " Item";

    document.getElementById("report").style.display = "block";
    document.getElementById("report").scrollIntoView();
}

function closeForm() {
    document.getElementById("report").style.display = "none";
}

function displayItems(data) {
    const list = document.getElementById("itemList");
    list.innerHTML = "";

    if (data.length === 0) {
        list.innerHTML = "<p>No items found.</p>";
        return;
    }

    data.forEach(item => {
        list.innerHTML += `
            <div class="card">
                <div class="emoji">${item.emoji || "📦"}</div>
                <span class="tag">${item.type} Item</span>
                <h3>${item.name}</h3>
                <p><b>Category:</b> ${item.category}</p>
                <p><b>Location:</b> ${item.location}</p>
                <p><b>Date:</b> ${item.date}</p>
                <p>${item.description}</p>
                <p><b>Contact:</b> ${item.email}</p>
            </div>
        `;
    });
}

document.getElementById("itemForm").addEventListener(
    "submit", function(event) {
        event.preventDefault();

        const newItem = {
            name: document.getElementById("itemName").value,
            category: document.getElementById("category").value,
            location: document.getElementById("location").value,
            date: document.getElementById("date").value,
            description: document.getElementById("description").value,
            email: document.getElementById("email").value,
            type: currentType,
            emoji: "📦"
        };

        items.unshift(newItem);
        displayItems(items);

        alert("Your report has been submitted!");

        this.reset();
        closeForm();
    }
);

function searchItems() {
    const value = document.getElementById("searchInput")
        .value.toLowerCase();

    const filtered = items.filter(item =>
        item.name.toLowerCase().includes(value) ||
        item.category.toLowerCase().includes(value) ||
        item.location.toLowerCase().includes(value)
    );

    displayItems(filtered);
}

displayItems(items);

</script>

</body>
</html>
